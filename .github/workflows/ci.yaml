name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Build a local source/SDK candidate after all checks (no publishing)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloud-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloud_agent_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: cloud_agent_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd="pg_isready -U cloud_agent_test"
          --health-interval=2s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm licenses:check
      - run: pnpm check
      - run: pnpm sdk:verify
      - run: pnpm contracts:check
      - run: pnpm evaluate
      - run: pnpm sbom
      - run: pnpm test:recovery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-and-verification
          path: |
            dist/sdk-package
            test-results/*.json
          retention-days: 14
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-diagnostics
          path: |
            test-results
            playwright-report
          retention-days: 14
      - run: docker build -t cloud-agent:local .
      - run: pnpm test:compose
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm supply-chain:check
  candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_release
    needs: [check, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:prepare
      - run: pnpm release:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-agent-release-candidate
          path: dist/release
          if-no-files-found: error
          retention-days: 30
