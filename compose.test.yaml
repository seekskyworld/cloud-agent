services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloud_agent_test
      POSTGRES_USER: cloud_agent_test
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55439:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_agent_test -d cloud_agent_test"]
      interval: 1s
      timeout: 5s
      retries: 30
